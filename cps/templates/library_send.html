{% from 'cw_icons.html' import icon %}
{% set send = library_send_choice(book) %}
{% if send %}
<button type="button" class="btn library-send-kindle" data-href="{{ url_for('web.send_to_ereader', book_id=book.id, book_format=send['format'], convert=send['convert']) }}">{{ icon('send') }}<span>{{ _('Send to Kindle') }}</span></button>
{% endif %}
